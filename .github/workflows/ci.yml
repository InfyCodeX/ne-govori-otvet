name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pip check
      - run: python -c "import app.main"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ne-govori-otvet:ci .
      - name: Start application
        run: docker run -d --name bot-smoke -p 127.0.0.1:8000:8000 -e BOT_MODE=demo ne-govori-otvet:ci
      - name: Check readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs bot-smoke
          exit 1
      - name: Stop application
        if: always()
        run: docker rm -f bot-smoke
